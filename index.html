<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Last Wanderer 3D</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            width: 100dvw;
            height: 100dvh;
            overflow: hidden;
            background-color: #0d1207;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            width: 100dvw;
            height: 100dvh;
            touch-action: none;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    <script src="main.js"></script>
    <script>
      // Force Fullscreen and Landscape Orientation on first click/tap
      function enterFullscreenLandscape() {
        const elem = document.documentElement;
        if (elem.requestFullscreen) {
          elem.requestFullscreen().then(() => {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(e => console.warn("Orientation lock failed:", e));
            }
          }).catch(e => console.warn("Fullscreen request failed:", e));
        } else if (elem.webkitRequestFullscreen) { // iOS Safari fallback
          elem.webkitRequestFullscreen();
        }
      }

      // Listen for the first interaction to trigger fullscreen
      window.addEventListener('pointerdown', function handleFirstInteraction() {
        enterFullscreenLandscape();
        window.removeEventListener('pointerdown', handleFirstInteraction);
      });

      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
      }
    </script>
</body>
</html>
